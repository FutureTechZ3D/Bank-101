name: Build Android APK & Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-apk:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BANK101/frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: BANK101/frontend
        run: npm ci

      - name: Build Web Application
        working-directory: BANK101/frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: BANK101/frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: BANK101/frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BANK101-Android-APK
          path: BANK101/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Web Application Build
        uses: actions/upload-artifact@v4
        with:
          name: BANK101-Web-Dist
          path: BANK101/frontend/dist/
          retention-days: 14

