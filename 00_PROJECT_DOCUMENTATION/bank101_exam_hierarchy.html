
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.screen{display:none}.screen.active{display:block}
.top-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:16px}
.back-btn{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--color-text-secondary)}
.back-btn:hover{background:var(--color-background-secondary)}
.breadcrumb{font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.breadcrumb .sep{opacity:.5}
.breadcrumb .curr{color:var(--color-text-primary);font-weight:500}
h2{font-size:15px;font-weight:500;margin:0 16px 14px;color:var(--color-text-primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:0 16px 16px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px 12px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:80px}
.card:hover{border-color:var(--color-border-primary);background:var(--color-background-secondary)}
.card .icon{font-size:20px;line-height:1}
.card .label{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
.card .sub{font-size:11px;color:var(--color-text-tertiary);line-height:1.3}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.pill-blue{background:var(--color-background-info);color:var(--color-text-info)}
.pill-green{background:var(--color-background-success);color:var(--color-text-success)}
.pill-amber{background:var(--color-background-warning);color:var(--color-text-warning)}
.quiz-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:0 16px 16px}
.qt-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px;display:flex;flex-direction:column;gap:4px}
.qt-card .qt-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.qt-card .qt-desc{font-size:11px;color:var(--color-text-secondary)}
.qt-card .qt-badge{margin-top:4px}
.section-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;padding:0 16px;margin:0 0 10px}
.divider{height:0.5px;background:var(--color-border-tertiary);margin:16px 16px 14px}
</style>

<div id="s-home" class="screen active">

    <span style="font-size:22px">🏦</span>

</div>

<div id="s-exam" class="screen">

</div>

<div id="s-subject" class="screen">

<div id="s-topic" class="screen">

let state={exam:null,type:null,subject:null};

function go(screen,data={}){
  Object.assign(state,data);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+screen).classList.add('active');
  if(screen==='exam') renderExam();
  if(screen==='subject') renderSubject();
  if(screen==='topic') renderTopic();
}

function renderHome(){
  const g=document.getElementById('exam-grid');
  g.innerHTML='';
  DATA.exams.forEach(e=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<span class="icon">${e.icon}</span><span class="label">${e.label}</span><span class="sub">${e.sub}</span>`;
    d.onclick=()=>go('exam',{exam:e});
    g.appendChild(d);
  });
}

function renderExam(){
  document.getElementById('exam-bc').textContent=state.exam.label;
  document.getElementById('exam-title').textContent=state.exam.label+' — Select Exam Type';
  const g=document.getElementById('type-grid');g.innerHTML='';
  state.exam.types.forEach(t=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<span class="label">${t.label}</span><span class="sub">${t.sub}</span>`;
    d.onclick=()=>go('subject',{type:t});
    g.appendChild(d);
  });
}

function renderSubject(){
  document.getElementById('sub-bc1').textContent=state.exam.label;
  document.getElementById('sub-bc2').textContent=state.type.label;
  document.getElementById('subject-title').textContent=state.type.label+' — Subjects';
  const g=document.getElementById('subject-grid');g.innerHTML='';
  state.type.subjects.forEach(s=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<span class="icon">${s.icon}</span><span class="label">${s.name}</span><span class="sub">${s.topics.length} topics</span>`;
    d.onclick=()=>go('topic',{subject:s});
    g.appendChild(d);
  });
  const qt=document.getElementById('qt-grid');qt.innerHTML='';
  QUIZ_TYPES.forEach(q=>{
    const d=document.createElement('div');d.className='qt-card';
    d.innerHTML=`<span class="qt-title"><i class="ti ${q.icon}" aria-hidden="true"></i> ${q.label}</span><span class="qt-desc">${q.desc}</span><span class="qt-badge"><span class="pill ${q.badgeClass}">${q.badge}</span></span>`;
    qt.appendChild(d);
  });
}

function renderTopic(){
  document.getElementById('top-bc1').textContent=state.exam.label;
  document.getElementById('top-bc2').textContent=state.type.label;
  document.getElementById('top-bc3').textContent=state.subject.name;
  document.getElementById('topic-title').textContent=state.subject.name+' — Topics';
  const g=document.getElementById('topic-grid');g.innerHTML='';
  state.subject.topics.forEach(t=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<span class="label">${t}</span>`;
    d.onclick=()=>sendPrompt('Tell me about quiz structure for topic: '+t+' under '+state.subject.name);
    g.appendChild(d);
  });
  const qt=document.getElementById('tq-grid');qt.innerHTML='';
  QUIZ_TYPES.forEach(q=>{
    const d=document.createElement('div');d.className='qt-card';
    d.innerHTML=`<span class="qt-title"><i class="ti ${q.icon}" aria-hidden="true"></i> ${q.label}</span><span class="qt-desc">${q.desc}</span><span class="qt-badge"><span class="pill ${q.badgeClass}">${q.badge}</span></span>`;
    qt.appendChild(d);
  });
}

renderHome();
</script>
